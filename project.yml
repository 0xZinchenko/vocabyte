name: Vocabyte

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 6.29.3
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    exactVersion: 2.3.0

options:
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Signed with the developer's free Apple Development certificate
    # (Personal Team), not ad-hoc: this makes macOS reset the Accessibility
    # permission less often across rebuilds than ad-hoc signing does.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K2UG27C83R
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Vocabyte:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vocabyte
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
    info:
      path: Sources/Vocabyte/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Vocabyte
        PRODUCT_NAME: Vocabyte
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - VocabyteTests

  VocabyteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VocabyteTests
    dependencies:
      - target: Vocabyte
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocabyteTests
        GENERATE_INFOPLIST_FILE: YES
