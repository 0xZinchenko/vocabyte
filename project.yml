name: Vocabyte

options:
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Ad-hoc signing for local development builds. Switch to Manual signing
    # with DEVELOPMENT_TEAM set once a free Apple Development certificate
    # is available (needed for stable Accessibility permission grants).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Vocabyte:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vocabyte
    info:
      path: Sources/Vocabyte/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Vocabyte
        PRODUCT_NAME: Vocabyte
    scheme:
      testTargets:
        - VocabyteTests

  VocabyteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VocabyteTests
    dependencies:
      - target: Vocabyte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.VocabyteTests
        GENERATE_INFOPLIST_FILE: YES
